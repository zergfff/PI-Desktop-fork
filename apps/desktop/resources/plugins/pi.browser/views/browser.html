<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>Browser</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --surface: #181818;
        --fg: #ffffff;
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --faint: color-mix(in oklab, #ffffff 38%, transparent);
        --border: color-mix(in oklab, #ffffff 5%, transparent);
        --accent: #ffffff;
        font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #fafafa;
        --surface: #ffffff;
        --fg: #1a1c1f;
        --muted: #5d5d5d;
        --faint: #afafaf;
        --border: color-mix(in oklab, #1a1c1f 5%, transparent);
        --accent: #1a1c1f;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body { padding-top: var(--pi-plugin-titlebar-height, 0px); overflow: hidden; }
      button, input { font: inherit; color: inherit; }
      button {
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      button:disabled { opacity: 0.35; cursor: default; }
      button:focus-visible, input:focus-visible {
        outline: 2px solid color-mix(in oklab, var(--accent) 58%, transparent);
        outline-offset: -2px;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .chrome {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .icon-btn {
        display: inline-flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        color: var(--muted);
      }
      .icon-btn:hover:not(:disabled) { background: color-mix(in oklab, var(--fg) 6%, transparent); }
      form.url {
        display: flex;
        flex: 1;
        min-width: 0;
      }
      form.url input {
        width: 100%;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--fg) 4%, transparent);
      }
      .guest {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }
      .empty[hidden] { display: none; }
      .empty h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
      }
      .empty p { margin: 0; max-width: 240px; }
      .shield {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 7px;
        border-radius: 999px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground, #8b8b8b);
        background: color-mix(in srgb, currentColor 10%, transparent);
      }
      .shield[data-active="true"] { color: #2f9e44; }
      .shield[hidden] { display: none; }
      .dl { position: relative; }
      .dl-badge {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 13px;
        height: 13px;
        padding: 0 3px;
        border-radius: 999px;
        background: var(--accent, #3b82f6);
        color: #fff;
        font-size: 9px;
        line-height: 13px;
        text-align: center;
      }
      .dl-badge[hidden] { display: none; }
      .dl-pop {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 30;
        width: 320px;
        max-height: 320px;
        overflow: auto;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid var(--border, #2a2a2a);
        background: var(--card, #1b1b1b);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .dl-pop[hidden] { display: none; }

      .dl-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 2px 6px;
        font-size: 11px;
        color: var(--muted-foreground, #8b8b8b);
      }
      .dl-head button {
        height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: 11px;
      }
      .dl-empty { padding: 12px 6px; font-size: 12px; color: var(--muted-foreground, #8b8b8b); }
      .dl-item { padding: 6px 4px; border-top: 1px solid var(--border, #2a2a2a); }
      .dl-item:first-of-type { border-top: 0; }
      .dl-name {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }
      .dl-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dl-state { flex: none; font-size: 10px; color: var(--muted-foreground, #8b8b8b); }
      .dl-bar {
        margin-top: 4px;
        height: 4px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 14%, transparent);
        overflow: hidden;
      }
      .dl-bar > i { display: block; height: 100%; background: var(--accent, #3b82f6); width: 0; }
      .dl-item[data-state="completed"] .dl-bar > i { background: #2f9e44; }
      .dl-item[data-state="cancelled"] .dl-bar > i,
      .dl-item[data-state="interrupted"] .dl-bar > i { background: #e03131; }
      .dl-cancel {
        margin-top: 4px;
        height: 20px;
        padding: 0 6px;
        border-radius: 5px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chrome">
        <button type="button" class="icon-btn" id="back" disabled title="Back" aria-label="Back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="forward" disabled title="Forward" aria-label="Forward">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="reload" disabled title="Reload" aria-label="Reload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="reload-icon"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
        <form class="url" id="form">
          <input id="url" spellcheck="false" autocapitalize="off" autocorrect="off" />
        </form>
        <div class="shield" id="shield" hidden data-active="false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span id="shield-count">0</span>
        </div>
        <div class="dl">
          <button type="button" class="icon-btn" id="downloads" title="Downloads" aria-label="Downloads">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
            <span class="dl-badge" id="dl-badge" hidden>0</span>
          </button>
          <div class="dl-pop" id="dl-pop" hidden>
            <div class="dl-head">
              <span id="dl-title">Downloads</span>
            </div>
            <div id="dl-list"><div class="dl-empty">还没有下载</div></div>
          </div>
        </div>
        <button type="button" class="icon-btn" id="external" disabled title="Open externally" aria-label="Open externally">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5"/><path d="M19 5l-9 9"/><path d="M5 9v10h10"/></svg>
        </button>
      </div>
      <div class="guest" id="guest">
        <div class="empty" id="empty">
          <h1 id="empty-title">No page open</h1>
          <p id="empty-body">Enter an address, or preview an HTML file from the conversation.</p>
        </div>
      </div>
    </div>
    <script>
      const bridge = window.pluginBridge;
      const back = document.getElementById("back");
      const forward = document.getElementById("forward");
      const reload = document.getElementById("reload");
      const external = document.getElementById("external");
      const form = document.getElementById("form");
      const input = document.getElementById("url");
      const guest = document.getElementById("guest");
      const shield = document.getElementById("shield");
      const shieldCount = document.getElementById("shield-count");
      const downloadsButton = document.getElementById("downloads");
      const downloadsBadge = document.getElementById("dl-badge");
      const downloadsPop = document.getElementById("dl-pop");
      const downloadsList = document.getElementById("dl-list");
      const downloadsTitle = document.getElementById("dl-title");
      let downloadCount = 0;
      const empty = document.getElementById("empty");
      const emptyTitle = document.getElementById("empty-title");
      const emptyBody = document.getElementById("empty-body");
      let inputFocused = false;
      let started = false;
      let locale = "en";

      const copy = {
        en: {
          back: "Back",
          forward: "Forward",
          reload: "Reload",
          stop: "Stop",
          external: "Open externally",
          placeholder: "Search or enter a URL",
          loadingTitle: "Loading page…",
          loadingBody: "Waiting for the website to respond. You can stop or enter another address.",
          stoppedTitle: "Loading stopped",
          stoppedBody: "Enter an address to try again.",
          failedTitle: "Could not open this page",
          failedBody: "Check the address or connection, then try again.",
          localFileBody: "Only existing local files can be opened.",
          emptyTitle: "No page open",
          emptyBody: "Enter an address, or preview an HTML file from the conversation.",
        },
        zh: {
          back: "后退",
          forward: "前进",
          reload: "重新加载",
          stop: "停止",
          external: "在外部打开",
          placeholder: "搜索或输入网址",
          loadingTitle: "正在加载网页…",
          loadingBody: "正在等待网站响应，可以停止加载或输入其他地址。",
          stoppedTitle: "已停止加载",
          stoppedBody: "输入网址可重新打开页面。",
          failedTitle: "无法打开此页面",
          failedBody: "请检查网址或网络连接，然后重试。",
          localFileBody: "只能打开已存在的本地文件。",
          emptyTitle: "尚未打开页面",
          emptyBody: "输入地址，或从对话预览 HTML 文件。",
        },
      };

      let navigationRequest = 0;
      let displayedContext = "";
      let navigationContext;
      const t = (key) => copy[locale]?.[key] ?? copy.en[key] ?? key;

      const applyCopy = () => {
        back.title = t("back");
        back.setAttribute("aria-label", t("back"));
        forward.title = t("forward");
        forward.setAttribute("aria-label", t("forward"));
        external.title = t("external");
        external.setAttribute("aria-label", t("external"));
        input.placeholder = t("placeholder");
        emptyTitle.textContent = t("emptyTitle");
        emptyBody.textContent = t("emptyBody");
      };

      const setBaseTheme = (appearance) => {
        const base = appearance?.base;
        document.documentElement.dataset.base =
          base === "light" || base === "dark"
            ? base
            : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const next = String(appearance?.locale ?? navigator.language).toLowerCase();
        locale = next.startsWith("zh") ? "zh" : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        applyCopy();
      };

      const paint = (state) => {
        const context = state?.sessionId && state?.tabId
          ? JSON.stringify([state.sessionId, state.tabId]) : displayedContext;
        const contextChanged = context !== displayedContext;
        displayedContext = context;
        if (contextChanged) {
          navigationRequest += 1;
          navigationContext = { sessionId: state.sessionId, tabId: state.tabId };
        }
        started = Boolean(state?.url) && !state?.loadError;
        empty.hidden = started && !state?.isLoading;
        const phase = state?.loadError === "ERR_ABORTED" ? "stopped" : state?.loadError ? "failed" : state?.isLoading ? "loading" : "empty";
        emptyTitle.textContent = t(`${phase}Title`);
        // 页面没加载出来时把原因也说出来，别让人对着空白猜。
        emptyBody.textContent = state?.loadError === "LOCAL_FILE_NOT_ALLOWED"
          ? t("localFileBody")
          : state?.loadError
            ? `${state.loadError}${state.loadErrorDetail ? ` · ${state.loadErrorDetail}` : ""}`
            : t(`${phase}Body`);
        back.disabled = !state?.canGoBack;
        forward.disabled = !state?.canGoForward;
        reload.disabled = !started;
        external.disabled = !state?.url;
        reload.title = state?.isLoading ? t("stop") : t("reload");
        reload.setAttribute("aria-label", reload.title);
        if (contextChanged || !inputFocused) input.value = state?.url ?? "";
        // The blocker runs in the host, so its count arrives with the state.
        const blocked = Number(state?.blocked ?? 0);
        shield.hidden = !(blocked > 0);
        shield.dataset.active = blocked > 0 ? "true" : "false";
        shieldCount.textContent = String(blocked);
        shield.title = blocked > 0 ? `已拦截 ${blocked} 个请求` : "";
        downloadCount = (state?.downloads ?? []).length;
        renderDownloads(state?.downloads ?? []);
        reportHole();
      };

      const reportHole = () => {
        const rect = guest.getBoundingClientRect();
        const hole = {
          x: Math.round(rect.x),
          y: Math.round(rect.y),
          width: Math.round(rect.width),
          height: Math.round(rect.height),
        };
        void bridge.invoke("browser.setBounds", hole);
        void bridge.invoke("browser.setVisible", { visible: started && hole.width > 0 && hole.height > 0 });
      };

      const formatBytes = (bytes) => {
        if (!bytes) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        let value = bytes;
        let index = 0;
        while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
        return `${value < 10 && index > 0 ? value.toFixed(1) : Math.round(value)} ${units[index]}`;
      };

      const stateText = (item) => {
        if (item.state === "completed") return "已完成";
        if (item.state === "cancelled") return "已取消";
        if (item.state === "interrupted") return "失败";
        if (item.totalBytes > 0) return `${Math.round((item.receivedBytes / item.totalBytes) * 100)}%`;
        return formatBytes(item.receivedBytes);
      };

      const renderDownloads = (items) => {
        const active = items.filter((item) => item.state === "progressing").length;
        downloadsBadge.hidden = active === 0;
        downloadsBadge.textContent = String(active);
        downloadsTitle.textContent = items.length ? `下载（${items.length}）` : "下载";
        if (!items.length) {
          downloadsList.innerHTML = '<div class="dl-empty">还没有下载</div>';
          return;
        }
        downloadsList.innerHTML = items
          .map((item) => {
            const percent = item.totalBytes > 0
              ? Math.min(100, Math.round((item.receivedBytes / item.totalBytes) * 100))
              : item.state === "completed" ? 100 : 0;
            const cancel = item.state === "progressing"
              ? `<button type="button" class="dl-cancel" data-cancel="${item.id}">取消</button>` : "";
            return `<div class="dl-item" data-state="${item.state}">
              <div class="dl-name"><span title="${item.filename}">${item.filename}</span><span class="dl-state">${stateText(item)}</span></div>
              <div class="dl-bar"><i style="width:${percent}%"></i></div>
              ${cancel}
            </div>`;
          })
          .join("");
      };

      // Chrome's downloads button: the list when there is something to list, the folder
      // otherwise. Nothing is more useless than an empty popover.
      downloadsButton.addEventListener("click", (event) => {
        event.stopPropagation();
        if (downloadCount === 0) {
          downloadsPop.hidden = true;
          void bridge.invoke("browser.openDownloadsFolder");
          return;
        }
        downloadsPop.hidden = !downloadsPop.hidden;
      });

      downloadsList.addEventListener("click", (event) => {
        const id = event.target?.dataset?.cancel;
        if (!id) return;
        void bridge.invoke("browser.cancelDownload", { id });
      });
      document.addEventListener("click", (event) => {
        if (!downloadsPop.hidden && !downloadsPop.contains(event.target) && event.target !== downloadsButton) {
          downloadsPop.hidden = true;
        }
      });

      // Chrome's two address-bar habits: Ctrl/Cmd+L to the address, and Ctrl/Cmd+Enter
      // to complete a bare word into www.<word>.com.
      document.addEventListener("keydown", (event) => {
        const mod = event.ctrlKey || event.metaKey;
        if (mod && event.key.toLowerCase() === "l") {
          event.preventDefault();
          input.focus();
          input.select();
          return;
        }
        if (event.key === "Escape" && document.activeElement === input) input.blur();
      });
      input.addEventListener("keydown", (event) => {
        const mod = event.ctrlKey || event.metaKey;
        if (event.key !== "Enter" || !mod) return;
        event.preventDefault();
        const value = input.value.trim();
        if (value && !/[:/\\]/.test(value) && !value.includes(".") && !value.includes(" ")) {
          input.value = `www.${value}.com`;
        }
        form.requestSubmit();
      });

      // Like any browser: what is not an address is a search. A bare word, a
      // phrase with spaces, or a host without a dot cannot be navigated to, so it
      // goes to the search engine instead of failing as a URL.
      const SEARCH_URL = "https://www.bing.com/search?q=";
      const asAddress = (raw) => {
        const value = raw.trim();
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
        if (!value || /\s/.test(value)) return null;
        const host = value.split("/")[0];
        if (!host.includes(".") || host.startsWith(".") || host.endsWith(".")) return null;
        return `https://${value}`;
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const raw = input.value.trim();
        if (!raw) return;
        const value = asAddress(raw) ?? `${SEARCH_URL}${encodeURIComponent(raw)}`;
        if (!asAddress(raw)) input.value = value;
        const request = ++navigationRequest;
        paint({ url: value, isLoading: true });
        void bridge.invoke("browser.navigate", { url: value, ...navigationContext }).then((state) => {
          if (request === navigationRequest && state) paint(state);
        }).catch(() => {
          if (request === navigationRequest) paint({ url: value, loadError: "navigation failed" });
        });
      });
      back.addEventListener("click", () => void bridge.invoke("browser.action", { action: "back", ...navigationContext }));
      forward.addEventListener("click", () => void bridge.invoke("browser.action", { action: "forward", ...navigationContext }));
      reload.addEventListener("click", () => {
        void bridge.invoke("browser.action", { action: reload.title === t("stop") ? "stop" : "reload", ...navigationContext });
      });
      external.addEventListener("click", () => void bridge.invoke("browser.openExternal", navigationContext));
      input.addEventListener("focus", () => {
        inputFocused = true;
        input.select();
      });
      input.addEventListener("blur", () => {
        inputFocused = false;
      });

      const observer = new ResizeObserver(reportHole);
      observer.observe(guest);
      window.addEventListener("resize", reportHole);

      bridge.on("browser:state", paint);
      bridge.on("appearance:changed", setBaseTheme);
      bridge.invoke("app.getAppearance").then(setBaseTheme).catch(() => setBaseTheme(null));
      const initialRequest = navigationRequest;
      void bridge.invoke("browser.getState").then((state) => {
        if (navigationRequest !== initialRequest) return;
        paint(state);
        reportHole();
      });
      applyCopy();
    </script>
  </body>
</html>
